<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鲜厨 · 智能食材管家</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B3%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f1e7; --card:#ffffff; --line:#eee3d2;
  --tx:#2b2622; --sub:#8a8177;
  --acc:#ff5d3a; --acc2:#ff8a4c; --green:#3fb27f; --amber:#f5a623; --red:#ff5a5f; --blue:#4a90d9;
  --r:16px; --shadow:0 4px 16px rgba(90,70,40,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  background:var(--bg); color:var(--tx); min-height:100vh;
  background-image:radial-gradient(600px 300px at 90% -50px,rgba(255,138,76,.10),transparent),
                   radial-gradient(500px 260px at -60px 40%,rgba(63,178,127,.08),transparent);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;outline:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#ddd0bc;border-radius:4px}

/* ===== header ===== */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(255,253,248,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.hd-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:23px;background:linear-gradient(135deg,var(--acc2),var(--acc));
  box-shadow:0 6px 14px rgba(255,93,58,.30);
}
.brand b{font-size:19px;letter-spacing:.5px}
.brand small{display:block;font-size:11px;color:var(--sub);font-weight:400;margin-top:1px}
.hd-stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:4px}
.hd-chip{
  font-size:12px;padding:5px 11px;border-radius:99px;background:#fff;
  border:1px solid var(--line);display:flex;align-items:center;gap:6px;color:var(--sub)
}
.dot{width:7px;height:7px;border-radius:50%}
nav{margin-left:auto;display:flex;gap:4px;background:#efe7d8;border-radius:99px;padding:4px}
nav button{
  padding:8px 18px;border-radius:99px;font-size:14px;font-weight:600;color:#7a7061;
  transition:all .18s;display:flex;align-items:center;gap:6px;position:relative
}
nav button.on{background:#fff;color:var(--tx);box-shadow:0 2px 8px rgba(90,70,40,.12)}
nav .bdg{
  min-width:17px;height:17px;padding:0 4px;border-radius:99px;font-size:11px;
  background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center
}

/* ===== layout ===== */
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.panel-title{display:flex;align-items:baseline;gap:10px;margin:4px 0 14px;flex-wrap:wrap}
.panel-title h2{font-size:20px}
.panel-title span{font-size:13px;color:var(--sub)}

/* ===== smart bar ===== */
.smart{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--shadow);margin-bottom:18px
}
.smart h3{font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:7px}
.smart p{font-size:12.5px;color:var(--sub);margin-bottom:12px}
.smart p b{color:var(--acc);font-weight:600}
.smart-row{display:flex;gap:10px;flex-wrap:wrap}
.smart input{
  flex:1;min-width:240px;border:1.5px solid var(--line);border-radius:12px;
  padding:12px 15px;font-size:14.5px;background:#fdfaf4;transition:border .18s
}
.smart input:focus{border-color:var(--acc2);background:#fff}
.btn{
  padding:11px 22px;border-radius:12px;font-size:14px;font-weight:600;
  transition:all .18s;white-space:nowrap
}
.btn-p{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;box-shadow:0 5px 13px rgba(255,93,58,.28)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(255,93,58,.35)}
.btn-g{background:#fff;border:1.5px solid var(--line);color:#6b6154}
.btn-g:hover{border-color:var(--acc2);color:var(--acc)}
.btn-d{background:#fff;border:1.5px solid var(--line);color:var(--red)}
.btn-d:hover{border-color:var(--red);background:#fff5f5}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

/* ===== stats ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)
}
.stat .ic{font-size:24px}
.stat b{font-size:21px;display:block;line-height:1.1}
.stat span{font-size:12px;color:var(--sub)}

/* ===== toolbar ===== */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input[type=search]{
  border:1.5px solid var(--line);border-radius:99px;padding:8px 16px;width:190px;background:#fff
}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  padding:7px 14px;border-radius:99px;font-size:13px;background:#fff;
  border:1.5px solid var(--line);color:#6b6154;font-weight:500;transition:all .15s
}
.chip:hover{border-color:var(--acc2)}
.chip.on{background:linear-gradient(135deg,var(--acc2),var(--acc));border-color:transparent;color:#fff;font-weight:600}
.chip .n{opacity:.7;font-size:12px;margin-left:2px}

/* ===== ingredient cards ===== */
.ing-group{margin-bottom:20px}
.ing-group>h4{font-size:14px;color:var(--sub);margin-bottom:10px;display:flex;gap:7px;align-items:center}
.ing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px}
.ing{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;position:relative;cursor:pointer;transition:all .18s;box-shadow:var(--shadow)
}
.ing:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(90,70,40,.13);border-color:#f3d9c4}
.ing .top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.ing .top .cat{font-size:11px;color:var(--sub)}
.iimg{
  position:relative;width:38px;height:38px;border-radius:50%;overflow:hidden;
  background:#f4ede0;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:inset 0 0 0 1px rgba(90,70,40,.06)
}
.iimg .ce{font-size:17px}
.iimg img,.dbig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ing .nm{font-size:15.5px;font-weight:700;margin-bottom:2px;padding-right:18px}
.ing .qt{font-size:12.5px;color:var(--sub);margin-bottom:10px}
.ing .del{
  position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:50%;
  color:#c9beac;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center
}
.ing .del:hover{background:#ffeceb;color:var(--red)}
.fbar{height:5px;border-radius:3px;background:#f1e8d8;overflow:hidden;margin-bottom:6px}
.fbar i{display:block;height:100%;border-radius:3px}
.f-fresh{color:var(--green)} .f-soon{color:var(--amber)} .f-expired{color:var(--red)}
.bg-fresh{background:var(--green)} .bg-soon{background:var(--amber)} .bg-expired{background:var(--red)}
.fday{font-size:12px;font-weight:600}
.eatb{font-size:11px;color:var(--green);font-weight:600}

/* ===== recipe cards ===== */
.empty{
  text-align:center;padding:56px 20px;color:var(--sub);background:var(--card);
  border:1.5px dashed var(--line);border-radius:var(--r)
}
.empty .big{font-size:52px;margin-bottom:12px}
.empty p{margin-bottom:16px;font-size:14px}
.r-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:14px}
.rc{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 14px 16px;cursor:pointer;transition:all .18s;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:8px
}
.rc:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(90,70,40,.15);border-color:#f3d9c4}
.rimg{
  position:relative;height:128px;border-radius:12px;overflow:hidden;
  background:#f4ede0;display:flex;align-items:center;justify-content:center
}
.rimg .re{font-size:44px}
.rimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s}
.rc:hover .rimg img{transform:scale(1.05)}
.rc .r1{display:flex;align-items:center;gap:8px;padding:0 2px}
.rc .rn{font-size:16.5px;font-weight:700}
.rc .rmeta{display:flex;gap:6px;flex-wrap:wrap;padding:0 2px}
.mchip{
  font-size:11.5px;padding:3px 9px;border-radius:99px;background:#f7f1e6;color:#7a7061
}
.mchip.ok{background:#e5f5ee;color:var(--green);font-weight:600}
.mchip.lack{background:#fdeee2;color:#e07a2e;font-weight:600}
.miss{font-size:12.5px;color:#b0763a;line-height:1.55;padding:0 2px}
.miss b{color:var(--red);font-weight:600}
.rbar{height:6px;border-radius:3px;background:#f1e8d8;overflow:hidden}
.rbar i{display:block;height:100%;border-radius:3px;transition:width .4s}

/* ===== shopping ===== */
.shop{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.shop-row{
  display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid #f4ede0
}
.shop-row:last-child{border-bottom:none}
.shop-row .nm{flex:1;font-size:14.5px;font-weight:600}
.shop-row.done .nm{text-decoration:line-through;color:#b7ac9b;font-weight:400}
.sbtn{
  width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:14px;border:1.5px solid var(--line);color:#6b6154;background:#fff;transition:all .15s
}
.sbtn.ok:hover{background:#e5f5ee;border-color:var(--green);color:var(--green)}
.sbtn.rm:hover{background:#ffeceb;border-color:var(--red);color:var(--red)}
.shop-note{font-size:12.5px;color:var(--sub);padding:12px 18px;background:#fdfaf4}

/* ===== health ===== */
.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px;margin-bottom:16px}
.goal{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;box-shadow:var(--shadow)
}
.goal .g1{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
.goal .g1 .en{margin-left:auto;font-size:12px;color:var(--sub);font-weight:500}
.goal .gdesc{font-size:11.5px;color:var(--sub);margin:3px 0 9px}
.gbar{height:7px;background:#f1e8d8;border-radius:4px;overflow:hidden;margin:7px 0}
.gbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#7ed6a5,#3fb27f);transition:width .4s}
.gbar.w i{background:linear-gradient(90deg,#7ec2f0,#4a90d9)}
.gstat{font-size:12px;margin-bottom:9px}
.gstat b{color:var(--green)}
.gsugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg{
  display:flex;align-items:center;gap:5px;font-size:11.5px;background:#faf6ee;
  border:1px solid var(--line);border-radius:99px;padding:3px 5px 3px 10px;color:#6b6154
}
.sugg.warn{border-color:#f2c79b;background:#fdf3ea;color:#b0763a}
.sugg .ok{
  width:18px;height:18px;border-radius:50%;background:#e5f5ee;color:var(--green);
  font-size:10px;display:flex;align-items:center;justify-content:center
}
.sugg .ok:hover{background:var(--green);color:#fff}
.health-bottom{display:grid;grid-template-columns:300px 1fr;gap:14px}
.wnum{font-size:36px;font-weight:800;margin:8px 0 0;color:var(--blue)}
.wnum small{font-size:14px;color:var(--sub);font-weight:500}
.wbtns{display:flex;gap:8px;margin-top:12px}
.remrow{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed #f0e5d2;font-size:13.5px;line-height:1.65}
.remrow:last-child{border-bottom:none}
.remrow .ri{font-size:18px;flex-shrink:0}
.remrow b{color:var(--tx)}
.remrow .rsub{color:var(--sub);font-size:12.5px}
.remrow .rgood{color:#2e7d5b;font-size:12.5px}

/* ===== ingredient detail nutrition ===== */
.nutri-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.nutri{background:#faf6ee;border-radius:11px;padding:11px 4px;text-align:center}
.nutri b{font-size:16.5px;display:block;color:var(--tx)}
.nutri.hot b{color:var(--acc)}
.nutri span{font-size:10.5px;color:var(--sub)}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.pill{font-size:11.5px;background:#eef7f1;color:#2e7d5b;border-radius:99px;padding:4px 11px;font-weight:600}
.goodbox{background:#f2faf5;border:1px solid #cdeadd;border-radius:13px;padding:13px 16px;font-size:13.5px;line-height:1.75;color:#2e6b4f;margin-bottom:12px}
.warnbox{background:#fdeeee;border:1px solid #f5c6c6;border-radius:13px;padding:12px 16px;font-size:13.5px;line-height:1.7;color:#a33d3d;margin-bottom:4px}
.nsub{font-size:12px;color:var(--sub);margin-bottom:10px}

/* ===== modal ===== */
.overlay{
  position:fixed;inset:0;z-index:100;background:rgba(40,32,24,.45);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .2s
}
.overlay.show{opacity:1;pointer-events:auto}
.modal{
  background:#fff;border-radius:20px;max-width:600px;width:100%;max-height:86vh;overflow-y:auto;
  padding:22px 28px 26px;transform:translateY(16px) scale(.98);transition:transform .22s
}
.overlay.show .modal{transform:none}
.mhero{
  position:relative;height:212px;border-radius:16px;overflow:hidden;
  background:#f4ede0;display:flex;align-items:center;justify-content:center;
  margin:2px 0 16px
}
.mhero .re{font-size:66px}
.mhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mhero .heroTag{
  position:absolute;left:12px;bottom:12px;background:rgba(43,38,34,.72);color:#fff;
  font-size:12.5px;padding:5px 12px;border-radius:99px;backdrop-filter:blur(4px)
}
.m-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.m-head .big{font-size:42px}
.dbig{
  position:relative;width:54px;height:54px;border-radius:16px;overflow:hidden;
  background:#f4ede0;display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.dbig .ce{font-size:26px}
.m-head h3{font-size:20px;margin-bottom:6px}
.m-head .msub{font-size:12.5px;color:var(--sub)}
.m-close{
  margin-left:auto;width:32px;height:32px;border-radius:50%;background:#f4ede0;
  color:#7a7061;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.m-close:hover{background:#ffeceb;color:var(--red)}
.mchips{display:flex;gap:6px;flex-wrap:wrap}
.sec{font-size:13.5px;font-weight:700;color:var(--sub);letter-spacing:1px;margin:20px 0 10px;display:flex;align-items:center;gap:6px}
.ig-list{display:flex;flex-direction:column;gap:7px}
.ig-row{
  display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:11px;
  background:#faf6ee;font-size:14px
}
.ig-row.have{background:#effaf3}
.ig-row.no{background:#fdf3ea;border:1px dashed #f2c79b}
.ig-row .st{width:20px;text-align:center}
.ig-row .iq{margin-left:auto;font-size:12.5px;color:var(--sub)}
.steps{list-style:none;position:relative}
.steps li{position:relative;padding:0 0 20px 46px}
.steps li::before{
  content:'';position:absolute;left:16px;top:34px;bottom:2px;width:2px;background:#f0e5d2
}
.steps li:last-child{padding-bottom:4px}
.steps li:last-child::before{display:none}
.snum{
  position:absolute;left:0;top:0;width:33px;height:33px;border-radius:50%;
  background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;font-weight:700;font-size:14.5px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(255,93,58,.3)
}
.steps p{font-size:14.5px;line-height:1.7;padding-top:5px}
.tip{
  background:#fff8ec;border:1px solid #f5e3bf;border-radius:13px;padding:13px 16px;
  font-size:13.5px;line-height:1.7;color:#8a6a33
}
.m-foot{margin-top:20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* ===== form ===== */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.form label{font-size:12.5px;color:var(--sub);display:block;margin-bottom:6px;font-weight:600}
.form input,.form select{
  width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 13px;background:#fdfaf4
}
.form input:focus,.form select:focus{border-color:var(--acc2);background:#fff}

/* ===== toast ===== */
#toast{
  position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);z-index:200;
  background:#2b2622;color:#fff;padding:11px 22px;border-radius:99px;font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:all .25s
}
#toast.show{opacity:1;transform:translateX(-50%)}

footer{text-align:center;font-size:12px;color:#b7ac9b;padding:10px 0 26px}

@media (max-width:640px){
  .hd-in{padding:10px 14px}
  nav{margin-left:0;width:100%}
  nav button{flex:1;justify-content:center;padding:8px 6px;font-size:13px}
  main{padding:16px 14px 50px}
  .form{grid-template-columns:1fr}
  .toolbar input[type=search]{width:100%}
  .health-bottom{grid-template-columns:1fr}
  .nutri-grid{grid-template-columns:repeat(5,1fr);gap:5px}
  .nutri b{font-size:13.5px}
  .mhero{height:170px}
}
</style>
</head>
<body>

<header>
  <div class="hd-in">
    <div class="brand">
      <div class="logo">🍳</div>
      <div><b>鲜厨</b><small>智能食材管家 · 有啥做啥</small></div>
    </div>
    <div class="hd-stats" id="hdStats"></div>
    <nav>
      <button data-act="tab" data-tab="fridge" class="on">🧺 食材库</button>
      <button data-act="tab" data-tab="recipes">🍲 菜谱推荐</button>
      <button data-act="tab" data-tab="health">❤️ 健康助手</button>
      <button data-act="tab" data-tab="shopping">🛒 购物清单 <span class="bdg" id="shopBadge" hidden>0</span></button>
    </nav>
  </div>
</header>

<main>
  <!-- ===== 食材库 ===== -->
  <section id="view-fridge">
    <div class="smart">
      <h3>✨ 智能收录</h3>
      <p>把买回来的食材一次贴进来，自动识别名称和数量，例如：<b>鸡蛋 6个、五花肉 500克、小葱 2根</b></p>
      <div class="smart-row">
        <input id="smartInput" placeholder="输入或粘贴食材，用顿号 / 逗号 / 换行分隔…" autocomplete="off">
        <button class="btn btn-p" data-act="smart-add">📥 一键收录</button>
        <button class="btn btn-g" data-act="add-manual">＋ 手动添加</button>
      </div>
    </div>

    <div class="stats" id="ingStats"></div>

    <div class="toolbar">
      <input type="search" id="ingSearch" placeholder="🔍 搜索食材…">
      <div class="chips" id="ingCats"></div>
    </div>

    <div id="ingGroups"></div>
  </section>

  <!-- ===== 菜谱推荐 ===== -->
  <section id="view-recipes" hidden>
    <div class="panel-title">
      <h2>今天做什么菜？</h2><span id="rSummary"></span>
    </div>
    <div class="toolbar">
      <input type="search" id="rSearch" placeholder="🔍 搜菜名…">
      <div class="chips" id="rMatchCats"></div>
      <div class="chips" id="rCats"></div>
      <button class="chip" id="pantryChip" data-act="toggle-pantry"></button>
      <button class="btn btn-p" data-act="rand-recipe" style="margin-left:auto">🎲 今天吃啥</button>
    </div>
    <div id="rBanner"></div>

    ['八角','1包','调味品',0,180],['干辣椒','1包','调味品',0,180],

  state.ingredients = S.map(([name,qty,cat,ago,shelf]) => ({

/* ==================== 日期 / 健康 ==================== */
function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayLabel(){
  const d = new Date();
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 周${'日一二三四五六'[d.getDay()]}`;
}
function resetHealthIfNewDay(){
  if(!state.health || state.health.date !== todayKey()){
    state.health = {date: todayKey(), eaten:{}, water:0};
    save();
  }
}
function catServings(cat){
  let n = 0;
  Object.entries(state.health.eaten).forEach(([cn, cnt]) => {
    if(guessCat(cn) === cat) n += cnt;
  });
  return n;
}
function eatenKcal(){
  let k = 0;
  Object.entries(state.health.eaten).forEach(([cn, cnt]) => {
    const e = NUTR[cn] || CAT_NUTR[guessCat(cn)] || CAT_NUTR['其他'];
    k += (e.k || 0) * cnt;
  });
  return Math.round(k);
}
function eatCount(name){ return state.health.eaten[canon(name)] || 0; }
function logEat(name){
  const c = canon(name);
  if(guessCat(c) === '调味品'){ toast('调味品类无需打卡'); return; }
  state.health.eaten[c] = (state.health.eaten[c] || 0) + 1;
  save(); renderAll();
  toast(`✅ 已打卡 ${name} · 今日第 ${state.health.eaten[c]} 份`);
}

/* ==================== 逻辑 ==================== */
function daysLeft(it){ return Math.ceil((it.addedAt + it.shelf*864e5 - Date.now())/864e5); }
function freshClass(it){
  const d = daysLeft(it);
  return d <= 0 ? 'expired' : (d <= 2 ? 'soon' : 'fresh');
}
function freshText(it){
  const d = daysLeft(it);
  if(d <= 0) return '已过期' + (-d) + '天';
  if(d === 1) return '明天到期';
  return '还剩 ' + d + ' 天';
}
function haveSet(){ return new Set(state.ingredients.map(i => canon(i.name))); }
function recipeStatus(r){
  const have = haveSet();
  const used = [];
  r.ing.forEach(([n,q,p]) => {
    if(p && state.pantryAssume) return;
    used.push({n, q, ok: have.has(canon(n))});
  });
  const missing = used.filter(x => !x.ok);
  return {used, missing, total: used.length,
          pct: used.length ? Math.round((used.length - missing.length)/used.length*100) : 0};
}
function sortedRecipes(){
  return RECIPES.map(r => ({r, s: recipeStatus(r)}))
    .sort((a,b) => a.s.missing.length - b.s.missing.length || a.r.n.localeCompare(b.r.n, 'zh'));
}

/* 智能解析："鸡蛋 6个、五花肉 500克" */
const QTY_RE = /(?:((?:\d+(?:\.\d+)?(?:\/\d+)?)|(?:半))\s*(个|只|枚|根|颗|把|块|片|盒|袋|瓶|罐|包|勺|听|卷|朵|条|张|杯|碗|斤|两|克|g|G|kg|公斤|毫升|ml|升|L|l|份|头|瓣|撮|段)?)\s*$/;
function parseSmart(text){
  const out = [];
  text.split(/[,，、;；\n]+/).forEach(part => {
    const s = part.trim();
    if(!s) return;
    const m = s.match(QTY_RE);
    let name, qty;
    if(m && m[0].length < s.length){
      qty  = (m[1] + (m[2]||'')).trim() || '适量';
      name = s.slice(0, s.length - m[0].length).trim();
    }else{
      name = s; qty = '适量';
    }
    if(name) out.push({name, qty});
  });
  return out;
}
function addIngredient(name, qty, cat, shelf){
  const c = canon(name);
  const exist = state.ingredients.find(i => canon(i.name) === c);
  if(exist){
    if(qty && qty !== '适量'){ exist.qty = qty; exist.addedAt = Date.now(); return 'upd'; }
    return 'dup';
  }
  cat = cat || guessCat(name);
  state.ingredients.push({id: uid(), name: name.trim(), qty: qty||'适量', cat, shelf: shelf || shelfOf(name, cat), addedAt: Date.now()});
  return 'add';
}
function addToShopping(names){
  let n = 0;
  names.forEach(nm => {
    if(!state.shopping.some(s => s.name === nm && !s.done)){
      state.shopping.push({id: uid(), name: nm, done: false});
      n++;
    }
  });
  save(); return n;
}
function nutrOf(name){
  const c = canon(name);
  if(NUTR[c]) return {e:NUTR[c], exact:true};
  const cat = guessCat(c);
  if(CAT_NUTR[cat]) return {e:CAT_NUTR[cat], exact:false};
  return {e:CAT_NUTR['其他'], exact:false};
}

    return `<div class="goal ${full?'full':''}">

  }).join('');

  const wpct = Math.min(100, Math.round(w/WATER_GOAL*100));

    <div class="g1">💧 喝水打卡<span class="en">目标 ${WATER_GOAL} 杯</span></div>

    <div class="gbar w"><i style="width:${wpct}%"></i></div>
    <div style="font-size:12px;color:var(--sub)">约 ${w*200} ml · 建议 ${WATER_GOAL*200} ml（1500–1700ml）</div>
    <div class="wbtns">

  const headImg = src
    ? `<div class="dbig"><span class="ce">${ce}</span><img src="${src}" alt="${esc(it.name)}" onerror="this.remove()"></div>`
    : `<div class="dbig"><span class="ce">${ce}</span></div>`;
  openModal(`
    <div class="m-head">
      ${headImg}
      <div>
        <h3>${esc(it.name)}</h3>
        <div class="msub">${esc(it.cat)} · ${esc(it.qty)} · <span class="f-${f}">${freshText(it)}</span>${ec?` · 今日已吃 ${ec} 份`:''}</div>
      </div>
      <button class="m-close" data-act="close-modal">✕</button>
    </div>
    <div class="sec">🔥 热量与营养成分 <span style="font-weight:500;color:#c9beac">每 100g</span></div>
    <div class="nutri-grid">
      <div class="nutri hot"><b>${num(n.k)}</b><span>千卡 热量</span></div>
      <div class="nutri"><b>${gg(n.p)}</b><span>蛋白质</span></div>
      <div class="nutri"><b>${gg(n.f)}</b><span>脂肪</span></div>
      <div class="nutri"><b>${gg(n.c)}</b><span>碳水</span></div>
      <div class="nutri"><b>${gg(n.fb)}</b><span>膳食纤维</span></div>
    </div>
    ${exact ? `
    <div class="sec">💊 能帮你补充</div>
    <div class="pills">${(n.key||[]).map(k=>`<span class="pill">${esc(k)}</span>`).join('')}</div>
    <div class="goodbox">💪 ${esc(n.good)}</div>
    ${n.warn ? `<div class="warnbox">⚠️ <b>注意：</b>${esc(n.warn)}</div>` : ''}
    ` : `
    <div class="nsub">（暂未收录该食材的精确数据，以下为${esc(it.cat)}类参考）</div>
    <div class="goodbox">💪 ${esc(n.good)}</div>
    `}
    <div class="m-foot">
      ${isCond ? `<button class="btn btn-g" disabled>调味品无需打卡</button>`
               : `<button class="btn btn-p" data-act="log-eat" data-name="${esc(it.name)}">✅ 今天吃过它（+1份）</button>`}
      <button class="btn btn-g" data-act="edit-ing" data-id="${it.id}">✏️ 编辑</button>
      <button class="btn btn-d" data-act="del-ing" data-id="${it.id}">🗑 删除</button>
      <button class="btn btn-g" data-act="close-modal">关闭</button>
    </div>`);
}

function openRecipe(name){
  const r = RECIPES.find(x => x.n === name);
  if(!r) return;
  const s = recipeStatus(r);
  const rows = s.used.map(x => `
    <div class="ig-row ${x.ok?'have':'no'}">
      <span class="st">${x.ok?'✅':'➕'}</span><span>${esc(x.n)}</span>
      <span class="iq">${esc(x.q)}${x.ok?' · 已有':' · 缺'}</span>
    </div>`).join('');
  const pantryNote = r.ing.some(i=>i[2]) && state.pantryAssume
    ? `<div style="font-size:12px;color:var(--sub);margin-top:8px">已默认你家里有盐、油、生抽等常备调料，可在菜谱页关闭该假设。</div>` : '';
  openModal(`
    <div class="mhero"><span class="re">${r.e}</span><img src="${dishImg(r)}" alt="${esc(r.n)}" onerror="this.remove()">
      <span class="heroTag">${esc(r.c)} · ${r.t} · ${r.d}</span>
    </div>
    <div class="m-head" style="margin-top:0">
      <div>
        <h3>${esc(r.n)}</h3>
        <div class="mchips">
          <span class="mchip ${s.missing.length?'lack':'ok'}">${s.missing.length?`缺 ${s.missing.length} 样`:'✅ 可直接做'}</span>
          <span class="mchip">备齐 ${s.pct}%</span>
        </div>
      </div>
      <button class="m-close" data-act="close-modal">✕</button>
    </div>
    <div class="sec">🧾 食材清单</div>
    <div class="ig-list">${rows}</div>${pantryNote}
    <div class="sec">👨‍🍳 制作流程</div>
    <ol class="steps">${r.steps.map((t,i)=>`<li><span class="snum">${i+1}</span><p>${esc(t)}</p></li>`).join('')}</ol>
    ${r.tip ? `<div class="tip">💡 <b>小贴士：</b>${esc(r.tip)}</div>` : ''}
    <div class="m-foot">
      ${s.missing.length ? `<button class="btn btn-p" data-act="add-missing" data-id="${esc(r.n)}">🛒 缺的 ${s.missing.length} 样加入购物清单</button>` : ''}
      <button class="btn btn-g" data-act="close-modal">关闭</button>
    </div>`);
}

function openIngModal(it){
  const isEdit = !!it;
  const name = it ? it.name : '';
  openModal(`
    <div class="m-head">
      <span class="big">${isEdit?'✏️':'➕'}</span>
      <div><h3>${isEdit?'编辑食材':'添加食材'}</h3></div>
      <button class="m-close" data-act="close-modal">✕</button>
    </div>
    <div class="form">
      <div class="full"><label>食材名称</label><input id="fName" value="${esc(name)}" placeholder="如：西红柿" autocomplete="off"></div>
      <div><label>数量</label><input id="fQty" value="${esc(it?it.qty:'')}" placeholder="如：3个 / 500克" autocomplete="off"></div>
      <div><label>分类</label><select id="fCat">${CATS.map(c=>`<option ${it&&it.cat===c.id?'selected':''}>${c.id}</option>`).join('')}</select></div>
      <div class="full"><label>可保存天数（决定新鲜度提醒）</label><input id="fShelf" type="number" min="1" value="${it?it.shelf:7}"></div>
    </div>
    <div class="m-foot">
      <button class="btn btn-p" data-act="save-ing" data-id="${it?it.id:''}">保存</button>
      <button class="btn btn-g" data-act="close-modal">取消</button>
    </div>`);
  setTimeout(()=>{ const f=$('#fName'); f.focus(); f.onblur = () => {
    if(!isEdit && f.value.trim()){ $('#fCat').value = guessCat(f.value.trim()); $('#fShelf').value = shelfOf(f.value.trim()); }
  };},50);
}

/* ==================== 交互 ==================== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act, id = t.dataset.id, v = t.dataset.v;

  switch(act){
    case 'tab': ui.tab = t.dataset.tab; renderAll(); break;
    case 'smart-add': doSmartAdd(); break;
    case 'add-manual': openIngModal(null); break;
    case 'detail-ing': if(e.target.closest('.del')) break; openDetail(id); break;
    case 'edit-ing': openIngModal(state.ingredients.find(i=>i.id===id)); break;
    case 'del-ing':
      state.ingredients = state.ingredients.filter(i => i.id !== id);
      save(); closeModal(); renderAll(); toast('已删除'); break;
    case 'save-ing': saveIng(id); break;
    case 'cat-ing': ui.ingCat = v; renderIngCats(); renderIngGroups(); break;
    case 'match-ing': ui.rMatch = v; renderRecipes(); break;
    case 'rcat': ui.rCat = v; renderRecipes(); break;
    case 'toggle-pantry':
      state.pantryAssume = !state.pantryAssume; save(); renderRecipes(); renderIngStats(); break;
    case 'open-recipe': openRecipe(id); break;
    case 'log-eat': logEat(t.dataset.name); break;
    case 'water-add':
      state.health.water = Math.min(20, state.health.water + 1);
      save(); renderAll(); break;
    case 'water-sub':
      state.health.water = Math.max(0, state.health.water - 1);
      save(); renderAll(); break;
    case 'add-missing': {
      const r = RECIPES.find(x => x.n === id);
      const n = addToShopping(r ? recipeStatus(r).missing.map(m => m.n) : []);
      toast(n ? `🛒 已把 ${n} 种食材加入购物清单` : '清单里已经有这些食材啦');
      renderHeader(); break;
    }
    case 'rand-recipe': {
      const pool = RECIPES.filter(r => recipeStatus(r).missing.length === 0);
      let pick;
      if(pool.length) pick = pool[Math.floor(Math.random()*pool.length)];
      else pick = sortedRecipes()[0].r;
      if(!pool.length) toast('食材还不够，先看看这份补充方案 👀');
      openRecipe(pick.n); break;
    }
    case 'shop-ingest': {
      const it = state.shopping.find(s => s.id === id);
      if(it){
        addIngredient(it.name, '适量');
        state.shopping = state.shopping.filter(s => s.id !== id);
        save(); renderAll(); toast(`✅ ${it.name} 已放入食材库`);
      }
      break;
    }
    case 'shop-del':
      state.shopping = state.shopping.filter(s => s.id !== id);
      save(); renderShopping(); renderHeader(); break;
    case 'shop-clear':
      state.shopping = state.shopping.filter(s => !s.done);
      save(); renderShopping(); renderHeader(); break;
    case 'close-modal': closeModal(); break;
  }
});

$('#ingSearch').addEventListener('input', e => { ui.ingQ = e.target.value.trim(); renderIngGroups(); });
$('#rSearch').addEventListener('input', e => { ui.rQ = e.target.value.trim(); renderRecipes(); });
$('#smartInput').addEventListener('keydown', e => { if(e.key === 'Enter') doSmartAdd(); });

function doSmartAdd(){
  const input = $('#smartInput');
  const text = input.value.trim();
  if(!text){ toast('先输入食材吧，例如：鸡蛋 6个、五花肉 500克'); return; }
  const items = parseSmart(text);
  if(!items.length){ toast('没有识别到食材，试试「鸡蛋 6个」这样的写法'); return; }
  let add = 0, upd = 0, dup = 0;
  items.forEach(({name, qty}) => {
    const r = addIngredient(name, qty);
    if(r === 'add') add++; else if(r === 'upd') upd++; else dup++;
  });
  input.value = '';
  save(); renderAll();
  let msg = `📥 已收录 ${add} 种新食材`;
  if(upd) msg += `，更新 ${upd} 种数量`;
  if(dup) msg += `，${dup} 种已有`;
  toast(msg);
}

function saveIng(id){
  const name = $('#fName').value.trim();
  if(!name){ toast('食材名称不能为空'); return; }
  const qty = $('#fQty').value.trim() || '适量';
  const cat = $('#fCat').value;
  const shelf = Math.max(1, parseInt($('#fShelf').value, 10) || 7);
  if(id){
    const it = state.ingredients.find(i => i.id === id);
    if(it){ Object.assign(it, {name, qty, cat, shelf}); }
  }else{
    const r = addIngredient(name, qty, cat, shelf);
    if(r === 'upd' || r === 'dup'){ toast('冰箱里已经有这种食材，已合并'); save(); renderAll(); closeModal(); return; }
  }
  save(); renderAll(); closeModal();
  toast(id ? '已保存' : `✅ ${name} 已入库`);
}

let toastTimer;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ==================== 启动 ==================== */
load();
if(!state.seeded) seed();
resetHealthIfNewDay();
renderAll();
</script>
</body>
</html>
